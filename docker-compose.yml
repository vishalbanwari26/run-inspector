# Postgres for the data, Redis for the step queue. The app only needs
# DATABASE_URL and REDIS_URL, so any existing instances work too.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: runinspector
    ports: ['5434:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d runinspector']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['6381:6379']

volumes:
  pgdata:
